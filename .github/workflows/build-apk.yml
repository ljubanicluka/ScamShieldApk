name: Build ScamShield APK

on:
  workflow_dispatch:
  push:
    branches: [main, community-feed-badges-2026-11-26]
    paths:
      - "app/**"
      - "web/**"
      - "scripts/**"
      - "tests/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inspect uploaded Stage 1 archive (read-only)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:ScamShieldApk-stage1-changed-files.zip > /tmp/stage1.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          import difflib

          archive = Path("/tmp/stage1.zip")
          expected = {
              "web/scamshield-app.html": "web/scamshield-app.html",
              "app/src/main/assets/index.html": "app/src/main/assets/index.html",
              "tests/ui/ui-regression.js": "tests/ui/ui-regression.js",
              "SCAMSHIELD_PROJECT_INSTRUCTIONS.md": "SCAMSHIELD_PROJECT_INSTRUCTIONS.md",
          }
          out = []
          with ZipFile(archive) as z:
              broken = z.testzip()
              if broken:
                  raise SystemExit(f"Corrupt ZIP entry: {broken}")
              infos = [i for i in z.infolist() if not i.is_dir()]
              extracted = {}
              out += [f"Archive bytes: {archive.stat().st_size}", f"Entries: {len(infos)}"]
              for info in infos:
                  out.append(f"ENTRY {info.filename} | {info.file_size} bytes | CRC {info.CRC:08x}")
                  suffix = next((s for s in expected if info.filename.endswith("/" + s)), None)
                  if suffix is None:
                      raise SystemExit(f"Unexpected archive entry: {info.filename}")
                  data = z.read(info)
                  extracted[suffix] = data
                  target = Path(expected[suffix])
                  current = target.read_bytes() if target.exists() else b""
                  out.append(f"FILE {suffix}: archive={len(data)} sha256={sha256(data).hexdigest()} current={len(current)} sha256={sha256(current).hexdigest() if target.exists() else 'MISSING'}")
                  if suffix in ("web/scamshield-app.html", "app/src/main/assets/index.html", "SCAMSHIELD_PROJECT_INSTRUCTIONS.md"):
                      a = current.decode("utf-8").splitlines(keepends=True)
                      b = data.decode("utf-8").splitlines(keepends=True)
                      diff = list(difflib.unified_diff(a, b, fromfile="current/"+suffix, tofile="archive/"+suffix, n=2))
                      out.append(f"DIFF {suffix}: {len(diff)} lines")
                      out.extend(diff)
                  elif suffix == "tests/ui/ui-regression.js":
                      out.append("NEW UI REGRESSION TEST CONTENT:")
                      out.extend(data.decode("utf-8").splitlines())
              if set(extracted) != set(expected):
                  raise SystemExit(f"Missing entries: {sorted(set(expected)-set(extracted))}")
              ui_a = extracted["web/scamshield-app.html"]
              ui_b = extracted["app/src/main/assets/index.html"]
              out.append(f"HTML COPIES IDENTICAL: {ui_a == ui_b}")
              if ui_a != ui_b:
                  raise SystemExit("The two HTML files in the ZIP differ.")
              if len(infos) != len(expected):
                  raise SystemExit("Archive contains extra files.")
          Path("stage1-archive-inspection.txt").write_text("\n".join(out), encoding="utf-8")
          print("\n".join(out[:12]))
          print("Full unified diffs and new test source are in the uploaded inspection artifact.")
          PY

      - name: Upload Stage 1 inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-archive-inspection
          path: stage1-archive-inspection.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Apply inspected Stage 1 archive to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:ScamShieldApk-stage1-changed-files.zip > /tmp/stage1.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          expected = {
              "web/scamshield-app.html",
              "app/src/main/assets/index.html",
              "tests/ui/ui-regression.js",
              "SCAMSHIELD_PROJECT_INSTRUCTIONS.md",
          }
          extracted = {}
          with ZipFile("/tmp/stage1.zip") as z:
              if z.testzip():
                  raise SystemExit("Stage 1 archive failed its ZIP integrity check.")
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  rel = next((p for p in expected if info.filename.endswith("/" + p)), None)
                  if rel is None or rel in extracted:
                      raise SystemExit(f"Unexpected or duplicate ZIP entry: {info.filename}")
                  extracted[rel] = z.read(info)
          if set(extracted) != expected:
              raise SystemExit(f"Archive manifest mismatch: missing {sorted(expected-set(extracted))}")
          if extracted["web/scamshield-app.html"] != extracted["app/src/main/assets/index.html"]:
              raise SystemExit("The two packaged HTML copies are not byte-identical.")
          instructions = Path("SCAMSHIELD_PROJECT_INSTRUCTIONS.md").read_bytes()
          archived_instructions = extracted["SCAMSHIELD_PROJECT_INSTRUCTIONS.md"]
          if not archived_instructions.startswith(instructions):
              raise SystemExit("The archived instructions do not preserve the current document as an exact prefix; refusing to overwrite.")
          test = extracted["tests/ui/ui-regression.js"].decode("utf-8")
          old = "const browser = await chromium.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });"
          new = "const browser = await chromium.launch({ args: ['--no-sandbox'] });"
          if old not in test:
              raise SystemExit("Could not find expected Chrome launcher line in UI regression test.")
          extracted["tests/ui/ui-regression.js"] = test.replace(old, new, 1).encode("utf-8")
          for rel, data in extracted.items():
              path = Path(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print(f"Applied {rel}: {len(data)} bytes")
          PY
          cmp -s web/scamshield-app.html app/src/main/assets/index.html
          node -e "const fs=require('fs'); console.log('HTML source/assets identical:', fs.readFileSync('web/scamshield-app.html').equals(fs.readFileSync('app/src/main/assets/index.html')))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/scamshield-app.html app/src/main/assets/index.html tests/ui/ui-regression.js SCAMSHIELD_PROJECT_INSTRUCTIONS.md
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m "feat: apply Stage 1 navigation fixes and UI regression tests"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Stage 1 files already match the branch."
          fi

      - name: Install Playwright and Chromium for UI regression test
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Run web and Kotlin source checks
        run: |
          node scripts/check-web.js
          node scripts/check-kotlin.js
          node scripts/test-phone-norm.js
          node scripts/test-qr-analyze.js
          node scripts/test-qr-decode.js
          node scripts/test-verdict.js
          node scripts/test-demo-community.js
          node scripts/test-community-seed.js
          node tests/ui/ui-regression.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScamShield-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package current tracked source for Claude
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import subprocess

          excluded_exact = {"ScamShieldApk-stage1-changed-files.zip"}
          excluded_prefixes = ("ScamShield-Stage1-Source/",)
          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\\0")
          output = Path("ScamShield-Stage2-Claude-Source.zip")
          count = 0
          with ZipFile(output, "w", compression=ZIP_DEFLATED, compresslevel=6) as archive:
              for raw in files:
                  if not raw:
                      continue
                  name = raw.decode("utf-8")
                  if name in excluded_exact or name.startswith(excluded_prefixes):
                      continue
                  path = Path(name)
                  if not path.is_file():
                      continue
                  archive.write(path, arcname="ScamShieldApk/" + name)
                  count += 1
          if count == 0 or not output.is_file() or output.stat().st_size == 0:
              raise SystemExit("Source archive was not created.")
          print(f"Packaged {count} tracked source files; archive size: {output.stat().st_size} bytes")
          PY

      - name: Upload Claude source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ScamShield-Stage2-Claude-Source
          path: ScamShield-Stage2-Claude-Source.zip
          if-no-files-found: error
          retention-days: 14
