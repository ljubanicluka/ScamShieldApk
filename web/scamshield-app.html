    feed:()=>{const ps=S.rep.map((p,i)=>({p,i})).filter(x=>x.p[0]===S.c);return`<h2>${T('Moje lokalne beleške','My local notes')}</h2>${chips()}<p class=warn>${T('Ovo nije javni feed. Beleške su sačuvane samo na ovom telefonu i nisu poslate drugim ljudima. Zajednička zajednica zahteva budući server.','This is not a public feed. Notes are saved only on this phone and are not shared. A shared community requires a future backend.')}</p><button class=b data-a=go data-v=report>${T('Napravi belešku o prevari','Create a scam note')}</button>${ps.length?ps.map(({p,i})=>{const newer=p[5]===true,when=newer?new Date(p[4]).toLocaleString():T('Starija lokalna beleška','Older local note'),targetText=newer?p[2]:T('Cilj nije sačuvan u starijoj belešci','Target was not retained in this older note'),body=newer?p[3]:p[2];return`<div class=card><span class=v rep>${T(TY[p[1]][0],TY[p[1]][1])}</span> <span class=v style="background:#5d6b86">${T('SAMO NA UREĐAJU','DEVICE ONLY')}</span><p class=mu>${E(when)}</p><p><b>${T('Meta','Target')}:</b> ${E(targetText)}</p><p>${E(body)}</p><button class="b alt" data-a=rd data-v=${i}>${T('Obriši belešku','Delete note')}</button></div>`}).join(''):`<div class=card><b>${T('Još nema lokalnih beleški','No local notes yet')}</b><p class=mu>${T('Sačuvaj prijavu kao privatnu belešku. Ništa se ne objavljuje niti šalje.','Save a report as a private note. Nothing is published or sent.')}</p></div>`}`},

family:()=>`<h2>${T('Zaštiti porodicu','Protect your family')}</h2><p class=mu>${T('Sve ide uz pristanak: nikoga ne pratimo i poruke se ne prosleđuju bez znanja druge osobe.','Everything is consent-based: nobody is tracked and no messages are forwarded without their knowledge.')}</p><div class=card>${[['Dogovorite porodičnu šifru za prave hitne slučajeve','Agree on a family safe word'],['Banke nikad ne traže PIN ni SMS kodove','Banks never ask for a PIN or SMS codes'],['Prekinite poziv i pozovite nazad na zvanični broj','Hang up and call back on the official number'],['Bez AnyDesk/TeamViewer na tuđ zahtev','No AnyDesk/TeamViewer on request'],['Deca: bez linkova od nepoznatih, recite odraslom','Kids: no links from strangers, tell an adult']].map((s,j)=>`<label class=k><input type=checkbox data-a=ck data-v=f${j} ${S.ck['f'+j]?'checked':''}><span>${T(s[0],s[1])}</span></label>`).join('')}</div><div class=card><b>${T('Poruka upozorenja','Warning message')}</b><input id=ft placeholder="${T('Sumnjiv broj ili link','Suspicious number or link')}"><p id=fm class=mu></p><button class=b data-a=fm>${T('Napravi i kopiraj poruku','Create and copy message')}</button></div><p class=mu>${T('Prava blokada poziva traži saradnju operatera i dozvole sistema. Ovo je demonstracija.','Real call blocking needs the operator and OS permissions. This is a demo.')}</p>${foot()}`,
    map:()=>`<h2>${T('Mapa prevara','Scam map')}</h2>${chips()}<div class=card><b>${T('Nema potvrđenih podataka po gradovima','No verified city-level data')}</b><p>${T('Ova verzija ne prikazuje izmišljene brojeve ili lokacije. Za sada nema povezanog sistema koji prikuplja i proverava prijave po gradovima.','This version does not display invented counts or locations. There is currently no connected system collecting and verifying city-level reports.')}</p></div><h3>${T('Zvanični izvori','Official sources')}</h3>${NW.map(n=>`<div class=card><a href="${n[1]}" rel=noopener>${E(n[0])}</a></div>`).join('')}`,
learn:()=>{const q=Q[qz.i];if(!q)return`<h2>${T('Rezultat','Score')}: ${qz.s}/${Q.length}</h2><button class=b data-a=qrs>${T('Ponovo','Restart')}</button>`;return`<h2>${T('Prepoznaj prevaru','Spot the scam')} ${qz.i+1}/${Q.length}</h2><div class=card>${T(q[0],q[1])}</div>${qz.a<0?`<button class=b data-a=qa data-v=1>${T('Prevara je','It is a scam')}</button><button class="b alt" data-a=qa data-v=0>${T('Deluje pravo','Looks real')}</button>`:`<p class=card>${qz.a==q[2]?'✔ ':'✖ '}${T(q[3],q[4])}</p><button class=b data-a=qn>${T('Dalje','Next')}</button>`}`},
tools:()=>`<h2>${T('Bezbednost uređaja','Device security')}</h2><p class=warn>${T('Ovaj ekran nije antivirus skener i ne pokreće VPN. Ne tvrdi da je telefon čist. Daje proverljive korake i otvara Android podešavanja; skeniranje uređaja obavlja Google Play Protect ili bezbednosna aplikacija kojoj verujete.','This screen is not an antivirus scanner and does not run a VPN. It cannot certify that the phone is clean. It provides practical checks and opens Android settings; device scanning is handled by Google Play Protect or a security app you trust.')}</p><div class=card><b>Google Play Protect</b><p>${T('Otvorite Play prodavnicu → profil → Play Protect → Skeniraj. Proverite da je zaštita uključena.','Open Play Store → profile → Play Protect → Scan. Check that protection is enabled.')}</p><a href="https://support.google.com/googleplay/answer/2812853" rel=noopener>${T('Zvanična uputstva za Play Protect','Official Play Protect instructions')}</a></div><div class=card><b>${T('Android ažuriranja','Android updates')}</b><p>${T('Instalirajte sistemska i bezbednosna ažuriranja kroz Podešavanja → Sistem → Ažuriranje sistema (putanja može da se razlikuje).','Install system and security updates through Settings → System → System update (the path varies by device).')}</p><button class="b alt" data-a=openSettings>${T('Otvori podešavanja ScamShield aplikacije','Open ScamShield app settings')}</button></div><div class=card><b>${T('Preporuke za računar','PC recommendations')}</b><p>${T('Na Windowsu ostavite Microsoft Defender uključen i ažuriran. Na Androidu koristite Play Protect i ažurirajte aplikacije.','On Windows, keep Microsoft Defender enabled and updated. On Android, use Play Protect and update apps.')}</p><a href="https://www.microsoft.com/windows/comprehensive-security" rel=noopener>Microsoft Windows Security</a></div><div class=card><b>${T('Šta ova aplikacija stvarno radi','What this app actually does')}</b><p>${T('Provera linkova koristi lokalna heuristička pravila i primere poznatih obrazaca. Ne šalje linkove na servis za reputaciju i ne skenira instalirane aplikacije.','Link checks use local heuristic rules and known-pattern examples. Links are not sent to a reputation service and installed apps are not scanned.')}</p></div>`,
evidence:()=>`<h2>${T('Dokazi','Evidence locker')}</h2><input id=et placeholder="${T('Naslov','Title')}"><textarea id=en rows=3 placeholder="${T('Šta se desilo, broj, iznos, referenca...','What happened, number, amount, reference...')}"></textarea><button class=b data-a=ev>${T('Sačuvaj','Save')}</button><p class=mu>${T('Samo na ovom telefonu. Ne čuvajte broj kartice ni PIN.','Only on this phone. Do not store card numbers or PINs.')}</p>${S.ev.map((e,i)=>`<div class=card><small class=mu>${e[0]}</small><b> ${E(e[1])}</b><p>${E(e[2])}</p><button class="b alt" data-a=evd data-v=${i}>${T('Obriši','Delete')}</button></div>`).join('')}`,

privacy:()=>`<h2>${T('Privatnost i podešavanja','Privacy & settings')}</h2><div class=card><p>${T('Uneti podaci, beleške i QR sadržaj ostaju na telefonu. Aplikacija preuzima samo javna upozorenja sa navedenih CERT/CIRT izvora; tim izvorima se ne šalju tvoje pretrage, poruke ili QR sadržaj. Spoljni sajtovi mogu primiti uobičajene podatke o poseti.','Entered data, notes and QR contents stay on this phone. The app downloads only public advisories from the listed CERT/CIRT sources; your searches, messages and QR contents are not sent to those sources. External websites may receive normal visit data.')}</p><p class=mu>${T('Zvanična upozorenja se preuzimaju uživo. Provera brojeva i linkova koristi lokalne heuristike, a ne potpunu reputacionu bazu.','Official advisories are fetched live. Number and link checks use local heuristics, not a complete reputation database.')}</p></div><button class=b data-a=big>${S.big?T('Veliki tekst: UKLJUČEN','Large text: ON'):T('Uključi veliki tekst','Turn on large text')}</button><button class="b alt" data-a=del id=dl>${T('Obriši sve moje podatke','Delete all my data')}</button>`,
news:()=>`<h2>${T('Zvanična upozorenja','Official warnings')}</h2><p class=warn>${T('Preuzimaju se samo javne objave. Sadržaj koji uneseš u aplikaciju ne šalje se CERT/CIRT izvorima. CERT RS pokriva samo Republiku Srpsku, ne celu BiH.','Only public advisories are downloaded. Content you enter in the app is not sent to CERT/CIRT sources. CERT RS covers Republika Srpska only, not all of Bosnia and Herzegovina.')}</p><button class=b data-a=refreshNews>${T('Osveži upozorenja','Refresh advisories')}</button><div id=feedStatus>${renderFeedStatus()}</div><div id=feedItems>${renderFeedItems()}</div><h3>${T('Zvanične stranice','Official websites')}</h3>${NW.slice(0,4).map(n=>`<div class=card><a href="${n[1]}">${E(n[0])}</a></div>`).join('')}`,
pass:()=>`<h2>${T('Provera lozinke','Password check')}</h2><p class=mu>${T('Procena se radi na telefonu. Lozinka se nikad ne šalje niti čuva.','Rated on your phone. The password is never sent or stored.')}</p><input id=pw type=password autocomplete=off><button class=b data-a=pw>${T('Proceni','Rate')}</button><div id=pr></div>`,
hash:()=>`<h2>${T('Provera fajla (SHA-256)','File hash check')}</h2><p class=mu>${T('Fajl se ne šalje i ne pokreće; računa se samo otisak.','The file is not uploaded or run; only its fingerprint is computed.')}</p><input id=hf type=file><div id=hr class=card></div>`,
breach:()=>`<h2>${T('Provera curenja podataka','Breach check')}</h2><div class=card><p>${T('Proverite svoj email na Have I Been Pwned. Otvara se njihov sajt; ScamShield ne šalje ništa.','Check your own email on Have I Been Pwned. Their site opens; ScamShield sends nothing.')}</p><a href="https://haveibeenpwned.com/" rel=noopener>haveibeenpwned.com</a><p class=mu>${T('Ako je email procurio: promenite lozinku, uključite dvostepenu prijavu.','If your email leaked: change the password and turn on 2-step login.')}</p></div>`,
ob:()=>{const slides=[['Dobrodošli u ScamShield','Welcome to ScamShield','Proveri broj, link, QR kod ili poruku pre nego što poveruješ.','Check a number, link, QR code or message before you trust it.'],['Provera linkova i QR kodova','Check links and QR codes','Skeniranje QR koda ne otvara automatski link. Uvek prvo pregledaj odredište.','Scanning a QR code never opens a link automatically. Always review the destination first.'],['Privatnost i kontrola','Privacy and control','Tvoji unosi i QR sadržaj obrađuju se na uređaju. Dozvole i deljenje podataka ostaju pod tvojom kontrolom.','Your entries and QR contents are processed on this device. Permissions and data sharing remain under your control.']];if(S.ob<3){const s=slides[S.ob];return `<section class="onboardWrap"><div class="onboardMark">◈</div><p class=eyebrow>${T('VODIČ KROZ APLIKACIJU','APP WALKTHROUGH')}</p><h1>${T(s[0],s[1])}</h1><p class=mu>${T(s[2],s[3])}</p><div class=onboardProgress><i style="width:${((S.ob+1)/4)*100}%"></i></div><small class=mu>${S.ob+1}/4</small><button class=b data-a=obn>${T('Nastavi','Continue')}</button><button class="b alt" data-a=skipTutorial>${T('Preskoči vodič','Skip tutorial')}</button></section>`;}return `<section class="onboardWrap"><p class=eyebrow>${T('PODEŠAVANJE NALOGA','PROFILE SETUP')}</p><h1>${T('Kreiraj svoj profil','Create your profile')}</h1><p class=mu>${T('Ovi podaci služe za prikaz profila na ovom uređaju. Prava prijava i email verifikacija zahtevaju bezbedan serverski nalog.','These details personalise your profile on this device. Real sign-in and email verification require secure server accounts.')}</p><label>${T('Uzrast','Age')}<input id=onAge type=number min=13 max=99 inputmode=numeric></label><label>${T('Ime','Name')}<input id=onName maxlength=50 autocomplete=name></label><label>${T('Korisničko ime','Username')}<input id=onUsername maxlength=24 autocomplete=username placeholder="korisnicko_ime"></label><label>${T('Pol','Sex')}<select id=onSex><option value=""> function feedDate(v){if(!v)return T('Datum nije dostupan','Date unavailable');const d=new Date(v);return Number.isNaN(d.getTime())?E(v):d.toLocaleString()}
function renderFeedStatus(){if(!LIVE.sources.length)return `<p class=mu>${T('Još nema preuzetih podataka. Dodirnite Osveži.','No advisories have been fetched yet. Tap Refresh.')}</p>`;return LIVE.sources.map(s=>{const status=s.status==='online'?T('Dostupno','Online'):s.status==='unavailable'?T('Nedostupno','Unavailable'):s.status==='cached'?T('Keširano','Cached'):T('Bez novih objava','No new items');const when=s.updatedAt?new Date(s.updatedAt).toLocaleString():T('Nikad','Never');return `<div class=card><b>${E(s.label)}</b><p class=mu>${status} · ${s.count} · ${T('Poslednje uspešno ažuriranje','Last successful update')}: ${E(when)}</p><p class=mu>${E(s.message||'')}</p></div>`}).join('')}
function renderFeedItems(){if(!LIVE.items.length)return `<div class=card>${T('Nema dostupnih upozorenja. Proverite status izvora ili otvorite zvaničnu stranicu.','No advisories are available. Check source status or open the official website.')}</div>`;return LIVE.items.map(item=>{const aud=item.audience==='ordinary'?T('Za građane','For ordinary users'):item.audience==='mixed'?T('Za građane i administratore','For users and administrators'):T('Za IT administratore','For IT administrators');return `<div class=card><span class=v style="background:${item.audience==='ordinary'?'#168c50':item.audience==='mixed'?'#8b6bb1':'#5d6b86'}">${aud}</span><h3>${E(item.title)}</h3>${item.excerpt?`<p>${E(item.excerpt)}</p>`:''}<p class=mu>${E(item.sourceLabel)} · ${E(feedDate(item.date))}</p><a href="${E(item.link)}">${T('Otvori originalnu objavu','Open original advisory')}</a></div>`}).join('')}
window.onLiveAdvisories=function(data){LIVE=data||{sources:[],items:[],refreshedAt:0};if(pg==='news'){const st=$('#feedStatus'),it=$('#feedItems'),rb=document.querySelector('[data-a=refreshNews]');if(st)st.innerHTML=renderFeedStatus();if(it)it.innerHTML=renderFeedItems();if(rb){rb.disabled=false;rb.textContent=T('Osveži upozorenja','Refresh advisories')}}};
function pwCheck(p){let sc=0;const f=[];if(p.length>=12)sc+=2;else if(p.length>=8)sc+=1;else f.push(['Prekratka (manje od 8 znakova).','Too short (under 8 characters).']);if(/[a-z]/.test(p)&&/[A-Z]/.test(p))sc+=1;else f.push(['Dodajte velika i mala slova.','Mix upper and lower case.']);if(/\d/.test(p))sc+=1;else f.push(['Dodajte brojeve.','Add numbers.']);if(/[^\w\s]/.test(p))sc+=1;else f.push(['Dodajte znak (!?#).','Add a symbol (!?#).']);if(/^(123456|password|lozinka|qwerty|111111|admin)/i.test(p)||/(.)\1{3,}/.test(p)){sc=0;f.push(['Predvidljiv obrazac.','Predictable pattern.'])}return{sc,f}}
addEventListener('change',async e=>{
 const i=e.target;
 if(i.id!=='hf'||!i.files||!i.files[0])return;
 const f=i.files[0];
 if(f.size>5e7){toast(T('Fajl je prevelik (preko 50 MB).','File too large (over 50 MB).'));i.value='';return}
 const box=$('#hr');box.textContent=T('Računam SHA-256...','Computing SHA-256...');
 try{
  if(!crypto.subtle||!f.arrayBuffer)throw new Error('SHA-256 API is unavailable in this WebView');
  const bytes=await f.arrayBuffer();
  const digest=await crypto.subtle.digest('SHA-256',bytes);
  const hash=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');
  box.innerHTML='<b>'+E(f.name)+'</b><p class=mu>SHA-256</p><p style="word-break:break-all"><code>'+hash+'</code></p><p>'+T('Otisak je izračunat lokalno. Nije proveravan u reputacionoj bazi; ovo nije ocena bezbednosti fajla.','Fingerprint computed locally. It was not checked against a reputation database and does not indicate whether the file is safe.')+'</p><button class="b alt" data-a=cp data-v="'+hash+'">'+T('Kopiraj SHA-256','Copy SHA-256')+'</button>';
 }catch(err){box.textContent=T('Nije moguće izračunati SHA-256 na ovom uređaju.','Could not compute SHA-256 on this device.')}
 i.value='';
});
